services:
  postgres:
    image: postgis/postgis:16-3.4
    environment: {POSTGRES_USER: tantravit, POSTGRES_PASSWORD: tantravit, POSTGRES_DB: tantravit}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U tantravit"], interval: 5s, retries: 10}
  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]
    volumes: ["./ai-service/models:/models"]   # optional: put watershed.pt here
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: {DATABASE_URL: "postgres://tantravit:tantravit@postgres:5432/tantravit", AI_URL: "http://ai-service:8000", UPLOAD_DIR: /data/uploads}
    ports: ["4000:4000"]
    volumes: [uploads:/data/uploads]
    depends_on: {postgres: {condition: service_healthy}, ai-service: {condition: service_started}}
volumes: {pgdata: {}, uploads: {}}
